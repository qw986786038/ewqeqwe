name: dart_json_mapper
version: 2.2.20
description: >
  This package allows programmers to annotate Dart objects in order to
  serialize / deserialize them from / to JSON.
homepage: https://github.com/k-paxian/dart-json-mapper
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  analyzer: ^13.3.0
  build: ^4.0.8
  build_config: ^1.3.1
  intl: ^0.20.3
  meta: ^1.19.0
  path: ^1.9.1
  reflectable: ^5.2.3
  collection: ^1.19.1
  pubspec_parse: ^1.5.0
  # Required by dart_json_mapper's public build_runner builder. Keeping this
  # as a regular dependency means applications do not need to declare the
  # implementation detail themselves.
  reflectable_builder: ^1.2.3
dev_dependencies:
  lints:
  build_runner:
