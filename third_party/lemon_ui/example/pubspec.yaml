name: lemon_ui_example
description: Example application for the lemon_ui package.
publish_to: none
version: 1.0.0+1

environment:
  # 本机 Flutter/Dart 为 3.12.x；上游约束为 ^3.13.0，本地临时放宽以便解析。
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  lemon_ui:
    path: ..
  # 上游用 git；本仓库有 vendored lemon_x（sdk ^3.12.1），本地改 path 以便解析。
  lemon_x:
    path: ../../lemon_x
  shared_preferences: ^2.5.6
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
